<section class="contact section" id="contact">

  <div class="container">

    <div class="section-title reveal reveal-up">

      <p>Contact</p>

      <h2>
        Let's Work Together
      </h2>

    </div>

    <div class="contact-grid">

      <!-- Contact Info -->
      <div class="contact-info glass reveal reveal-left delay-1">
        <h3>
          Get In Touch
        </h3>

        <p>
          Feel free to contact me for collaborations,
          internships, or development opportunities.
        </p>

        <div class="contact-item">

          <i class="fa-solid fa-envelope"></i>

          <span>
            yourmail@example.com
          </span>

        </div>

        <div class="contact-item">

          <i class="fa-solid fa-location-dot"></i>

          <span>
            India
          </span>

        </div>

        <div class="social-icons">

          <a href="#">
            <i class="fa-brands fa-github"></i>
          </a>

          <a href="#">
            <i class="fa-brands fa-linkedin"></i>
          </a>

          <a href="#">
            <i class="fa-brands fa-instagram"></i>
          </a>

        </div>

      </div>

      <!-- Contact Form -->
      <form class="contact-form glass reveal reveal-right delay-2">

        <input
          type="text"
          placeholder="Your Name"
          required
        />

        <input
          type="email"
          placeholder="Your Email"
          required
        />

        <textarea
          rows="6"
          placeholder="Your Message"
          required
        ></textarea>

        <button type="submit" class="btn primary-btn">
          Send Message
        </button>

      </form>

    </div>

  </div>

</section>
